# Q-Lifeboat hosted service on Fly.io: one Machine serves the dashboard, the diana REST/RPC proxies, the onboarding API
# and one agent per owner (child processes). Build context = repo root; run `cd contracts && forge build` first.
#
# Secrets go in with `fly secrets set`, never in this file: FUNDER_MNEMONIC (required for onboarding) and,
# optionally, HOSTED_AGENT_ANTHROPIC_API_KEY (LLM incident summaries; the template is used without it).

app = "q-lifeboat"
primary_region = "sin"
# Agents are mostly idle pollers: a 4th one pages instead of running the Machine out of memory.
swap_size_mb = 512

[build]
  dockerfile = "apps/hosted/Dockerfile"

[env]
  PORT = "8080"
  HOSTED_DATA_DIR = "/data"
  # Fly's proxy appends the client IP to X-Forwarded-For: the starter-pack per-IP cap reads it.
  TRUST_PROXY = "1"
  # 1 GB Machine: measured on Fly the service takes ~172 MB RSS and each agent ~185 MB (3 agents left ~206 MB free).
  # The 4th agent leans on the swap below; owner #5 gets a clean "capacity" refusal.
  HOSTED_MAX_AGENTS = "4"
  # Public test-token addresses on diana (README, "Addresses").
  FUSD_ADDRESS = "0x8478737e5ac2c2cbf70aad17f459d1b8ab8a7a14"
  FETH_ADDRESS = "0x0a958bba25f5fddca1b1f9cec44bdf076a8ea6c5"
  FBTC_ADDRESS = "0xbd16bc9ffaddf241593d891844cc4281f5af903e"

# Owner state, guardian secrets and incidents. A volume belongs to one Machine: keep the app at exactly one.
[mounts]
  source = "qlifeboat_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # The agents watch the chain all the time: a stopped Machine rescues nothing.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/status"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
